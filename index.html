<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CRM Edwige et Florence EL-ÉNERGIE</title>
    <style>
        input[type="email"]::-webkit-calendar-picker-indicator {
            display: none;
        }
        input[type="email"] {
            background-image: none;
        }
        /* Enlever spinners des champs number */
        input[type="number"]::-webkit-outer-spin-button,
        input[type="number"]::-webkit-inner-spin-button {
            -webkit-appearance: none;
            margin: 0;
        }
        input[type="number"] {
            -moz-appearance: textfield;
        }
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: Helvetica, Arial; background: #f5f5f5; }

        :root {
            --color-primary: #0F4761;
            --color-accent: #F37322;
        }

        body.florence-mode {
            --color-primary: #004D7A;
            --color-accent: #00A8B5;
        }

        .container { display: flex; height: 100vh; }
        .sidebar { width: 250px; background: var(--color-primary); color: white; padding: 20px; overflow-y: auto; }
        .sidebar h1 { font-size: 16px; margin-bottom: 30px; }
        .sidebar h2 { margin: 20px 0 10px; font-size: 12px; text-transform: uppercase; color: #aaa; }
        .sidebar button { width: 100%; padding: 10px; margin: 5px 0; background: white; color: var(--color-primary); border: none; border-radius: 4px; cursor: pointer; font-weight: 600; font-size: 14px; }
        .sidebar button.active { background: var(--color-accent); }
        .main { flex: 1; display: flex; flex-direction: column; }
        .header { background: var(--color-primary); color: white; padding: 20px; display: flex; justify-content: space-between; align-items: center; }
        .header h1 { font-size: 20px; }
        .header-actions button { background: var(--color-accent); color: white; padding: 8px 16px; border: none; border-radius: 4px; cursor: pointer; margin-left: 10px; font-weight: 600; font-size: 12px; }
        .header-actions select { background: var(--color-accent); color: white; padding: 8px 12px; border-radius: 4px; border: none; font-weight: 600; cursor: pointer; }
        .content { flex: 1; overflow: auto; padding: 20px; }
        .view { display: none; }
        .view.active { display: block; }
        table { width: 100%; border-collapse: collapse; background: white; margin-top: 15px; font-size: 12px; }
        th { background: var(--color-primary); color: white; padding: 12px; text-align: left; font-size: 12px; font-weight: 600; }
        td { padding: 12px; border-bottom: 1px solid #ddd; font-size: 12px; }
        tr:hover { background: #f9f9f9; }
        .btn-edit { background: var(--color-accent); color: white; padding: 6px 12px; border: none; border-radius: 4px; cursor: pointer; font-size: 11px; font-weight: 600; }
        .btn-delete { background: #d32f2f; color: white; padding: 6px 12px; border: none; border-radius: 4px; cursor: pointer; font-size: 11px; font-weight: 600; margin-left: 5px; }
        .btn-doc { background: #ccc; color: white; padding: 4px 8px; border: none; border-radius: 3px; cursor: pointer; font-size: 10px; font-weight: 600; min-width: 60px; }
        .btn-doc.genere { background: #4caf50; }
        .btn-doc.envoye { background: #2196f3; }
        .btn-doc.signe { background: #ff9800; }
        .modal { display: none; position: fixed; top: 0; left: 0; right: 0; bottom: 0; background: rgba(0,0,0,0.5); z-index: 1000; justify-content: center; align-items: center; }
        .modal.active { display: flex; }
        .modal-content { background: white; padding: 30px; border-radius: 8px; max-width: 600px; width: 90%; max-height: 80vh; overflow-y: auto; }
        .modal-content h2 { color: var(--color-primary); margin-bottom: 20px; font-size: 18px; }
        .form-group { margin-bottom: 15px; }
        .form-group label { display: block; margin-bottom: 5px; font-weight: 600; color: var(--color-primary); font-size: 13px; }
        .form-group input, .form-group select, .form-group textarea { width: 100%; padding: 10px; border: 1px solid #ddd; border-radius: 4px; font-size: 13px; font-family: Helvetica, Arial; }
        .modal-footer { margin-top: 20px; text-align: right; }
        .modal-footer button { padding: 10px 20px; margin-left: 10px; border: none; border-radius: 4px; cursor: pointer; font-weight: 600; font-size: 13px; }
        .button-cancel { background: #ccc; color: #333; }
        .button-save { background: var(--color-accent); color: white; }
        h2 { color: var(--color-primary); margin-bottom: 15px; font-size: 18px; }
        .statut-badge { display: inline-block; padding: 4px 8px; border-radius: 3px; font-size: 11px; font-weight: 600; }
        .statut-prospect { background: #e8f4f8; color: var(--color-primary); }
        .statut-encours { background: #fff3e0; color: var(--color-accent); }
        .statut-facture { background: #e8f5e9; color: #2e7d32; }
        .statut-paye { background: #f3e5f5; color: #6a1b9a; }
        .statut-termine { background: #e0f2f1; color: #00695c; }
    </style>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>

<div class="container">
    <div class="sidebar">
        <h1>EL-ÉNERGIE</h1>
        <h2>MES CLIENTS</h2>
        <button class="nav-btn active" onclick="switchView('dashboard')">📊 Dashboard</button>
        <button class="nav-btn" onclick="switchView('bilans')">📋 Bilans</button>
        <button class="nav-btn" onclick="switchView('formations')">🎓 Formations</button>
        <button class="nav-btn" onclick="switchView('animations')">🎤 Animations</button>
        <button class="nav-btn" onclick="switchView('seminaires')">🎯 Séminaires</button>
    </div>

    <div class="main">
        <div class="header">
            <h1>EL-ÉNERGIE CRM</h1>
            <div class="header-actions">
                <select id="userSelector" onchange="switchUser()">
                    <option value="Edwige">👤 Edwige</option>
                    <option value="Florence">👤 Florence</option>
                </select>
                <button onclick="showAddClientModal()">+ Ajouter Client</button>
                <button onclick="exportData()">📥 Export JSON</button>
                <button onclick="triggerImport()">📤 Import JSON</button>
            </div>
            <input type="file" id="importFile" style="display: none;" onchange="importData(event)">
        </div>
        <div class="content">
            <div id="dashboard" class="view active">
                <h2>Tableau Bord</h2>
                <div id="dashboardContent"></div>
            </div>

            <div id="bilans" class="view">
                <h2>Bilans de Compétences</h2>
                <div id="bilansTable"></div>
            </div>

            <div id="formations" class="view">
                <h2>Formations</h2>
                <div id="formationsTable"></div>
            </div>

            <div id="animations" class="view">
                <h2>Animations</h2>
                <div id="animationsTable"></div>
            </div>

            <div id="seminaires" class="view">
                <h2>Séminaires</h2>
                <div id="seminairesTable"></div>
            </div>

            <!-- MODALE AJOUTER/MODIFIER -->
            <div id="editModal" class="modal">
                <div class="modal-content">
                    <h2 id="modalTitle">Ajouter Client</h2>

                    <div class="form-group">
                        <label>Nom Client</label>
                        <input type="text" id="editClientName">
                    </div>

                    <div class="form-group">
                        <label>Entreprise</label>
                        <input type="text" id="editEntreprise">
                    </div>

                    <div class="form-group">
                        <label>Type Prestation</label>
                        <input type="text" id="editPrestationType">
                    </div>

                    <div class="form-group">
                        <label>Montant TTC (€)</label>
                        <input type="number" id="editMontantTTC">
                    </div>

                    <div class="form-group">
                        <label>Statut</label>
                        <select id="editStatut">
                            <option value="Prospect">Prospect</option>
                            <option value="En cours">En cours</option>
                            <option value="Facturé">Facturé</option>
                            <option value="Payé">Payé</option>
                            <option value="Terminé">Terminé</option>
                        </select>
                    </div>

                    <div class="form-group">
                        <label>Notes</label>
                        <textarea id="editNotes" rows="3"></textarea>
                    </div>

                    <div class="modal-footer">
                        <button class="button-cancel" onclick="closeModal()">Annuler</button>
                        <button class="button-save" onclick="saveRecord()">Enregistrer</button>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>

<script>
// ===== SUPABASE =====
const SUPABASE_URL = 'https://eyxycdpeprmmzunsmskp.supabase.co';
const SUPABASE_KEY = 'sb_publishable_0S1on9ZfI4pEp4IBFhkrNw_Xt-hL9y6';
const supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

let currentUser = 'Edwige';
let editingRecord = null;
let editingType = null;

let data = {
    bilans: [
        {id:1, clientName:'Clémence Bach', email:'', telephone:'', contact2:'', email2:'', telephone2:'', entreprise:'', prestationType:'Premium', montantTTC:1920, statut:'En cours', notes:'', type:'bilan', documents:{}, utilisateur:'Edwige'},
        {id:2, clientName:'Schéhérazade Bencherif', email:'schehrazadebencherif@gmail.com', telephone:'06 34 25 22 32', contact2:'', email2:'', telephone2:'', entreprise:'', prestationType:'Premium', montantTTC:1850, statut:'Facturé', notes:'', type:'bilan', documents:{}, utilisateur:'Edwige'},
        {id:3, clientName:'Thomas Surier', email:'Thomas.surier@gmail.com', telephone:'+33 6 85 85 47 55', contact2:'', email2:'', telephone2:'', entreprise:'Salarié', prestationType:'Premium', montantTTC:1850, statut:'En cours', notes:'6 RDV de 2h', type:'bilan', documents:{}, utilisateur:'Edwige'},
        {id:5, clientName:'Julie Cousseau', email:'julie.cousseau@laposte.net', telephone:'06 37 80 30 20', contact2:'', email2:'', telephone2:'', entreprise:'', prestationType:'Bilan', montantTTC:1850, statut:'Prospect', notes:'', type:'bilans', documents:{}, utilisateur:'Edwige'}
    ],
    formations: [
        {id:1, clientName:'PML - GDI', email:'', telephone:'', contact2:'Laura Mercurio', email2:'', telephone2:'', entreprise:'Provence-Métropole Logement', prestationType:'GDI', montantTTC:3000, statut:'Prospect', notes:'Contact: Laura Mercurio', type:'formation', documents:{}, utilisateur:'Edwige'},
        {id:2, clientName:'PML - QVCT', email:'', telephone:'', contact2:'', email2:'', telephone2:'', entreprise:'Provence-Métropole Logement', prestationType:'QVCT', montantTTC:5400, statut:'Facturé', notes:'280 collaborateurs', type:'formation', documents:{}, utilisateur:'Edwige'},
        {id:3, clientName:'Légimétrie', email:'', telephone:'', contact2:'', email2:'', telephone2:'', entreprise:'Dwell', prestationType:'Formation Vente', montantTTC:2900, statut:'Facturé', notes:'4 jours', type:'formation', documents:{}, utilisateur:'Edwige'},
        {id:4, clientName:'dinde', email:'mail', telephone:'0681032047', contact2:'', email2:'', telephone2:'', entreprise:'dupon', prestationType:'formation', montantTTC:6000, statut:'Prospect', notes:'', type:'formations', documents:{}, utilisateur:'Florence'}
    ],
    animations: [
        {id:1, clientName:'FNAIM', email:'', telephone:'', contact2:'', email2:'', telephone2:'', entreprise:'FNAIM', prestationType:'Animation', montantTTC:300, statut:'Facturé', notes:'', type:'animation', documents:{}, utilisateur:'Edwige'}
    ],
    seminaires: [],
    listeStagiaires: []
};

// ===== FONCTIONS CRITIQUES =====
// TOUJOURS sauvegarder dans localStorage en PREMIER (synchrone, rapide, fiable)
function saveData() {
    try {
        localStorage.setItem('el-energie-crm-data-v2', JSON.stringify(data));
        console.log('✓ Données sauvegardées dans localStorage');
    } catch (e) {
        alert('⚠️ Impossible de sauvegarder les données: ' + e.message);
    }
    // Sync Supabase en arrière-plan (non-bloquant)
    syncToSupabaseBackground();
}

function loadData() {
    try {
        const saved = localStorage.getItem('el-energie-crm-data-v2');
        if (saved) {
            data = JSON.parse(saved);
            console.log('✓ Données chargées depuis localStorage');
        }
    } catch (e) {
        console.warn('Impossible de charger localStorage:', e);
    }
}

async function syncToSupabaseBackground() {
    // Sync non-bloquant en arrière-plan
    try {
        for (const record of (data.bilans || [])) {
            await supabaseClient.from('bilans').upsert(record, { onConflict: 'id' }).catch(e => null);
        }
        for (const record of (data.formations || [])) {
            await supabaseClient.from('formations').upsert(record, { onConflict: 'id' }).catch(e => null);
        }
        for (const record of (data.animations || [])) {
            await supabaseClient.from('animations').upsert(record, { onConflict: 'id' }).catch(e => null);
        }
        for (const record of (data.seminaires || [])) {
            await supabaseClient.from('seminaires').upsert(record, { onConflict: 'id' }).catch(e => null);
        }
        for (const record of (data.listeStagiaires || [])) {
            await supabaseClient.from('listeStagiaires').upsert(record, { onConflict: 'id' }).catch(e => null);
        }
        console.log('✓ Sync Supabase en arrière-plan');
    } catch (e) {
        // Ignorer les erreurs de sync - les données sont sauvegardées localement
    }
}

function switchView(view) {
    document.querySelectorAll('.view').forEach(v => v.classList.remove('active'));
    document.querySelectorAll('.nav-btn').forEach(b => b.classList.remove('active'));
    document.getElementById(view).classList.add('active');
    event.target.classList.add('active');
    renderTable(view);
}

function switchUser() {
    currentUser = document.getElementById('userSelector').value;
    applyUserColors();
    renderDashboard();
    renderTable('bilans');
    renderTable('formations');
    renderTable('animations');
    renderTable('seminaires');
}

function applyUserColors() {
    if (currentUser === 'Florence') {
        document.body.classList.add('florence-mode');
    } else {
        document.body.classList.remove('florence-mode');
    }
}

function renderDashboard() {
    const bilans = (data.bilans || []).filter(b => b.utilisateur === currentUser);
    const formations = (data.formations || []).filter(f => f.utilisateur === currentUser);
    const animations = (data.animations || []).filter(a => a.utilisateur === currentUser);
    const seminaires = (data.seminaires || []).filter(s => s.utilisateur === currentUser);

    const totalBilans = bilans.reduce((sum, b) => sum + (Number(b.montantTTC) || 0), 0);
    const totalFormations = formations.reduce((sum, f) => sum + (Number(f.montantTTC) || 0), 0);
    const totalAnimations = animations.reduce((sum, a) => sum + (Number(a.montantTTC) || 0), 0);
    const totalSeminaires = seminaires.reduce((sum, s) => sum + (Number(s.montantTTC) || 0), 0);
    const total = totalBilans + totalFormations + totalAnimations + totalSeminaires;

    document.getElementById('dashboardContent').innerHTML = `
        <div style="display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 15px;">
            <div style="background: white; padding: 20px; border-radius: 4px; text-align: center;">
                <div style="font-size: 24px; font-weight: bold; color: var(--color-primary);">${bilans.length}</div>
                <div style="color: #999;">Bilans</div>
                <div style="font-size: 14px; font-weight: 600; color: var(--color-accent); margin-top: 10px;">${totalBilans}€</div>
            </div>
            <div style="background: white; padding: 20px; border-radius: 4px; text-align: center;">
                <div style="font-size: 24px; font-weight: bold; color: var(--color-primary);">${formations.length}</div>
                <div style="color: #999;">Formations</div>
                <div style="font-size: 14px; font-weight: 600; color: var(--color-accent); margin-top: 10px;">${totalFormations}€</div>
            </div>
            <div style="background: white; padding: 20px; border-radius: 4px; text-align: center;">
                <div style="font-size: 24px; font-weight: bold; color: var(--color-primary);">${animations.length}</div>
                <div style="color: #999;">Animations</div>
                <div style="font-size: 14px; font-weight: 600; color: var(--color-accent); margin-top: 10px;">${totalAnimations}€</div>
            </div>
            <div style="background: white; padding: 20px; border-radius: 4px; text-align: center;">
                <div style="font-size: 24px; font-weight: bold; color: var(--color-primary);">${total}</div>
                <div style="color: #999;">Total CA</div>
                <div style="font-size: 14px; font-weight: 600; color: var(--color-accent); margin-top: 10px;">€</div>
            </div>
        </div>
    `;
}

function renderTable(type) {
    const records = data[type] || [];
    const container = document.getElementById(type + 'Table');
    if (!container) return;

    const userRecords = (records || []).filter(r => !r.utilisateur || r.utilisateur === currentUser);

    if (!userRecords.length) {
        container.innerHTML = '<p>Aucune donnée</p>';
        return;
    }

    let html = '<table><tr><th>Nom</th><th>Entreprise</th><th>Type</th><th>Montant</th><th>Responsable</th><th>Statut</th><th>Actions</th></tr>';

    userRecords.forEach(r => {
        const statut = r.statut || 'Prospect';
        html += `<tr>
            <td>${r.clientName || ''}</td>
            <td>${r.entreprise || ''}</td>
            <td>${r.prestationType || ''}</td>
            <td>${r.montantTTC || 0}€</td>
            <td><span style="background: ${r.utilisateur === 'Edwige' ? '#F37322' : '#8b5a8e'}; color: white; padding: 4px 8px; border-radius: 2px; font-size: 11px; font-weight: 600;">${r.utilisateur || 'Edwige'}</span></td>
            <td><span style="display: inline-block; padding: 4px 8px; border-radius: 3px; font-size: 11px; font-weight: 600; background: #f0f0f0;">${statut}</span></td>
            <td>
                <button class="btn-edit" onclick="editRecord('${type}', ${r.id})">✎</button>
                <button class="btn-delete" onclick="deleteRecord('${type}', ${r.id})">✕</button>
            </td>
        </tr>`;
    });

    html += '</table>';
    container.innerHTML = html;
}

function showAddClientModal() {
    editingRecord = null;
    editingType = null;
    document.getElementById('modalTitle').innerText = 'Ajouter Client';
    document.getElementById('editClientName').value = '';
    document.getElementById('editEntreprise').value = '';
    document.getElementById('editPrestationType').value = '';
    document.getElementById('editMontantTTC').value = '';
    document.getElementById('editStatut').value = 'Prospect';
    document.getElementById('editNotes').value = '';
    document.getElementById('editModal').classList.add('active');
}

function editRecord(type, id) {
    editingType = type;
    editingRecord = data[type].find(r => r.id === id);
    if (!editingRecord) return;

    document.getElementById('modalTitle').innerText = 'Modifier Client';
    document.getElementById('editClientName').value = editingRecord.clientName || '';
    document.getElementById('editEntreprise').value = editingRecord.entreprise || '';
    document.getElementById('editPrestationType').value = editingRecord.prestationType || '';
    document.getElementById('editMontantTTC').value = editingRecord.montantTTC || 0;
    document.getElementById('editStatut').value = editingRecord.statut || 'Prospect';
    document.getElementById('editNotes').value = editingRecord.notes || '';
    document.getElementById('editModal').classList.add('active');
}

function closeModal() {
    document.getElementById('editModal').classList.remove('active');
}

function saveRecord() {
    const name = document.getElementById('editClientName').value.trim();
    const entreprise = document.getElementById('editEntreprise').value.trim();
    const prestationType = document.getElementById('editPrestationType').value.trim();
    const montantTTC = parseInt(document.getElementById('editMontantTTC').value) || 0;
    const statut = document.getElementById('editStatut').value;
    const notes = document.getElementById('editNotes').value.trim();

    if (!name || !prestationType) {
        alert('Nom et Type sont obligatoires');
        return;
    }

    if (editingRecord) {
        editingRecord.clientName = name;
        editingRecord.entreprise = entreprise;
        editingRecord.prestationType = prestationType;
        editingRecord.montantTTC = montantTTC;
        editingRecord.statut = statut;
        editingRecord.notes = notes;
        renderTable(editingType);
    } else {
        const guessType = prestationType.toLowerCase().includes('bilan') ? 'bilans' :
                         prestationType.toLowerCase().includes('animation') ? 'animations' : 'formations';
        data[guessType].push({
            id: Date.now(),
            clientName: name,
            entreprise: entreprise,
            prestationType: prestationType,
            montantTTC: montantTTC,
            statut: statut,
            notes: notes,
            utilisateur: currentUser,
            documents: {}
        });
        renderTable(guessType);
    }

    saveData();
    closeModal();
    renderDashboard();
}

function deleteRecord(type, id) {
    if (confirm('Supprimer ?')) {
        data[type] = data[type].filter(r => r.id !== id);
        renderTable(type);
        saveData();
        renderDashboard();
    }
}

function exportData() {
    const json = JSON.stringify(data, null, 2);
    const blob = new Blob([json], { type: 'application/json' });
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = 'CRM_data_' + new Date().toISOString().slice(0, 10) + '.json';
    a.click();
    URL.revokeObjectURL(url);
}

function triggerImport() {
    document.getElementById('importFile').click();
}

function importData(event) {
    const file = event.target.files[0];
    if (!file) return;

    const reader = new FileReader();
    reader.onload = function(e) {
        try {
            const imported = JSON.parse(e.target.result);
            data = imported;
            saveData();
            alert('✓ Données importées');
            renderDashboard();
            renderTable('bilans');
            renderTable('formations');
            renderTable('animations');
            renderTable('seminaires');
        } catch (err) {
            alert('Erreur : fichier JSON invalide - ' + err.message);
        }
    };
    reader.readAsText(file);
    event.target.value = '';
}

// ===== INIT =====
document.addEventListener('DOMContentLoaded', () => {
    loadData(); // Charge localStorage
    applyUserColors();
    renderDashboard();
    renderTable('bilans');
    renderTable('formations');
    renderTable('animations');
    renderTable('seminaires');

    // Sync vers Supabase en arrière-plan toutes les 30 secondes
    setInterval(syncToSupabaseBackground, 30000);
});
</script>

</body>
</html>
